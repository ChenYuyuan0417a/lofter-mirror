name: Bootstrap main.py

# 一次性工作流：把本地写好的 main.py 下载到仓库并提交，随后自我删除。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download main.py
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/tFEyXpOgdy" -o main.py
          wc -c main.py
          python3 -m py_compile main.py
          head -n 1 main.py

      - name: Commit and self-destruct
        run: |
          set -e
          git config user.name  "lofter-mirror-bot"
          git config user.email "lofter-mirror-bot@users.noreply.github.com"
          git rm -f .github/workflows/bootstrap.yml
          git add main.py
          git commit -m "add: main.py"
          git push origin HEAD:main
