name: seed-data

on:
  push:
    paths:
      - '.github/workflows/seed-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download data.json
        run: curl -fsSL https://aka.doubaocdn.com/s/wCtJK64E1v -o data.json

      - name: verify
        run: |
          ls -l data.json
          python3 -c "import json;d=json.load(open('data.json'));print('posts:',len(d['posts']))"

      - name: commit
        run: |
          git config user.name "mirror-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "seed data.json" || echo "nothing to commit"
          git push

      - name: self remove
        run: |
          git rm -f .github/workflows/seed-data.yml
          git commit -m "remove seed workflow"
          git push
