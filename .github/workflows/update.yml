name: LOFTER Mirror Sync

# 触发方式：
#   1) 定时（UTC 时间，cron 表达式按 UTC 计算）—— 默认每 6 小时跑一次，
#      对应北京时间 02:00 / 08:00 / 14:00 / 20:00
#   2) 手动：仓库页 → Actions → LOFTER Mirror Sync → Run workflow
#   3) 改了 main.py / 依赖 / 本文件后自动跑一次，免得改了代码不生效
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

# 同一时间只允许一个同步任务，避免两个 job 同时改 data.json 打架
concurrency:
  group: lofter-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装无头浏览器
        run: python -m playwright install --with-deps chromium

      - name: 检查 Cookie Secret
        env:
          C: ${{ secrets.LOFTER_COOKIE }}
        run: |
          if [ -z "$C" ]; then
            echo "::error::仓库里没有配置 LOFTER_COOKIE，抓不到内容。请看 README 第 4 步。"
            exit 1
          fi

      - name: 同步博客
        env:
          LOFTER_BLOG: "xinjinjumin904472226641"
          LOFTER_COOKIE: ${{ secrets.LOFTER_COOKIE }}
        run: python main.py

      - name: 提交并推送
        run: |
          set -e
          git config user.name  "lofter-mirror-bot"
          git config user.email "lofter-mirror-bot@users.noreply.github.com"

          git add data.json
          if [ -d images ]; then git add images; fi

          if git diff --cached --quiet; then
            echo "本轮没有变化，无需提交"
            exit 0
          fi

          git commit -m "sync: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push origin HEAD:${GITHUB_REF_NAME}
